[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-temporal-knowledge-graph-anchor"
version = "0.1.0"
description = "Time-stamped event graph maintainer tracking entity state changes and preventing anachronistic hallucinations"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-temporal-knowledge-graph-anchor = "agent_temporal_knowledge_graph_anchor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_temporal_knowledge_graph_anchor*"]
